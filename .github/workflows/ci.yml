name: Day 2 CI
run-name: CI by @${{ github.actor }} (${{ github.event_name }})

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      python-version:
        description: Python version to test with
        type: choice
        options: ["3.12", "3.13"]
        default: "3.13"
      create-package:
        description: Build the package
        type: boolean
        default: true
  schedule:
    - cron: "0 7 * * 1" # Mondays 07:00 UTC

permissions:
  contents: read

env:
  APP_NAME: temperature

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ inputs.python-version || '3.13' }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest -v --junitxml=reports/junit.xml

      - name: Announce failure
        if: failure()
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: echo "🚨 Tests failed on ${BRANCH}"

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: reports/junit.xml
          retention-days: 5

  package:
    needs: test
    # Skip only when run manually with create-package unchecked.
    if: github.event_name != 'workflow_dispatch' || inputs.create-package
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5

      - name: Compute version
        id: version
        run: echo "version=0.1.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Build tarball
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p dist
          tar -czf "dist/${APP_NAME}-${VERSION}.tar.gz" temperature.py README.md
          ls -l dist

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: package
          path: dist/*.tar.gz
          if-no-files-found: error

  verify:
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download package
        uses: actions/download-artifact@v4
        with:
          name: package
          path: dist

      - name: Extract and smoke-test
        env:
          VERSION: ${{ needs.package.outputs.version }}
        run: |
          mkdir pkg
          tar -xzf "dist/${APP_NAME}-${VERSION}.tar.gz" -C pkg
          cd pkg
          python3 -c "from temperature import celsius_to_fahrenheit as c; assert c(100) == 212; print('Package OK')"

  report:
    needs: [test, package]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      # secrets can't be used in `if:`, so expose a true/false flag instead.
      HAS_NOTIFY_TOKEN: ${{ secrets.NOTIFY_TOKEN != '' }}
    steps:
      - name: Write job summary
        env:
          REPORT_TITLE: ${{ vars.REPORT_TITLE || 'CI Report' }}
          VERSION: ${{ needs.package.outputs.version || 'n/a' }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EVENT_NAME: ${{ github.event_name }}
          TEST_RESULT: ${{ needs.test.result }}
          PACKAGE_RESULT: ${{ needs.package.result }}
        run: |
          echo "test:    ${TEST_RESULT}"
          echo "package: ${PACKAGE_RESULT}"
          {
            echo "## ${REPORT_TITLE}"
            echo ""
            echo "| Item | Value |"
            echo "|------|-------|"
            echo "| App | \`${APP_NAME}\` |"
            echo "| Version | \`${VERSION}\` |"
            echo "| Commit | \`${COMMIT_SHA::7}\` |"
            echo "| Event | \`${EVENT_NAME}\` |"
            echo "| test | ${TEST_RESULT} |"
            echo "| package | ${PACKAGE_RESULT} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Send notification
        if: env.HAS_NOTIFY_TOKEN == 'true'
        env:
          NOTIFY_TOKEN: ${{ secrets.NOTIFY_TOKEN }}
        run: |
          echo "Notification sent (token length: ${#NOTIFY_TOKEN})"

  pr-comment:
    needs: package
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - name: Comment on PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          VERSION: ${{ needs.package.outputs.version }}
        run: |
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --body "✅ CI passed. Package version ${VERSION} is ready."
